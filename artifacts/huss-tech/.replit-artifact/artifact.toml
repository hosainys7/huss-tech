kind = "web"
previewPath = "/"
title = "Huss Tech"
version = "1.0.0"
id = "artifacts/huss-tech"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20242

[services.development]
run = "pnpm --filter @workspace/huss-tech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/huss-tech", "run", "build" ]
publicDir = "artifacts/huss-tech/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20242"
BASE_PATH = "/"
